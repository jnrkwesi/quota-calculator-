<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quota Calculator</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d23; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --good: #16a34a; --track: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e7e9ee; --muted: #9aa1ad;
      --border: #2a2e36; --accent: #60a5fa; --good: #4ade80; --track: #252932;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field { position: relative; }
  .field span {
    position: absolute; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }
  .field .pre { left: 12px; }
  .field .suf { right: 12px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  input.has-pre { padding-left: 26px; }
  input.has-suf { padding-right: 30px; }
  input:focus { outline: none; border-color: var(--accent); }
  .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; }
  .stat + .stat { border-top: 1px solid var(--border); }
  .stat .k { color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail { font-size: 13px; color: var(--muted); text-align: right; }
  .bar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; margin: 4px 0 14px; }
  .bar div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s; }
  .bar.over div { background: var(--good); }
  .good { color: var(--good); }
  h2 { font-size: 17px; margin: 28px 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); }
  td { font-variant-numeric: tabular-nums; border-top: 1px solid var(--border); }
  td:nth-child(2), td:nth-child(3), th:nth-child(2), th:nth-child(3) { text-align: right; }
  tr.current { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  tr.current td:first-child { font-weight: 600; }
  .badge {
    display: inline-block; margin-left: 8px; padding: 1px 7px; font-size: 11px;
    font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 99px; vertical-align: middle;
  }
</style>
</head>
<body>
<main>
  <h1>Quota Calculator</h1>
  <p class="sub">Track attainment and commission against your annual number.</p>

  <section class="card grid">
    <div>
      <label for="quota">Annual quota</label>
      <div class="field"><span class="pre">$</span>
        <input id="quota" class="has-pre" type="number" min="0" step="1000" value="1000000"></div>
    </div>
    <div>
      <label for="closed">Closed-won so far</label>
      <div class="field"><span class="pre">$</span>
        <input id="closed" class="has-pre" type="number" min="0" step="1000" value="650000"></div>
    </div>
    <div>
      <label for="base">Base commission rate</label>
      <div class="field"><span class="suf">%</span>
        <input id="base" class="has-suf" type="number" min="0" step="0.1" value="10"></div>
    </div>
    <div>
      <label for="accel">Accelerator rate (above 100%)</label>
      <div class="field"><span class="suf">%</span>
        <input id="accel" class="has-suf" type="number" min="0" step="0.1" value="15"></div>
    </div>
  </section>

  <section class="card">
    <div class="stat"><span class="k">Attainment</span><span class="v" id="att">–</span></div>
    <div class="bar" id="bar"><div></div></div>
    <div class="stat">
      <span class="k">Commission earned</span>
      <div><div class="v" id="comm">–</div><div class="detail" id="commDetail"></div></div>
    </div>
    <div class="stat"><span class="k">Left to hit 100%</span><span class="v" id="left">–</span></div>
  </section>

  <h2>Attainment scenarios</h2>
  <section class="card" style="padding:12px 12px 8px">
    <table>
      <thead>
        <tr>
          <th>Attainment</th>
          <th>Closed-won needed</th>
          <th>Total commission</th>
        </tr>
      </thead>
      <tbody id="scenarios"></tbody>
    </table>
  </section>

  <h2>What if I close a deal?</h2>
  <section class="card">
    <label for="deal">Deal size</label>
    <div class="field"><span class="pre">$</span>
      <input id="deal" class="has-pre" type="number" min="0" step="1000" value="100000"></div>
  </section>

  <section class="card">
    <div class="stat">
      <span class="k">Commission on this deal</span>
      <div><div class="v" id="dealComm">–</div><div class="detail" id="dealDetail"></div></div>
    </div>
    <div class="stat"><span class="k">New attainment</span><span class="v" id="newAtt">–</span></div>
    <div class="bar" id="newBar"><div></div></div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const num = id => Math.max(0, parseFloat($(id).value) || 0);
  const usd = n => n.toLocaleString(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });

  // Base rate applies up to quota; accelerator rate applies only to the portion above quota.
  function commissionFor(total, quota, base, accel) {
    return Math.min(total, quota) * base + Math.max(0, total - quota) * accel;
  }

  function setBar(id, pct) {
    $(id).classList.toggle('over', pct >= 100);
    $(id).firstElementChild.style.width = Math.min(pct, 100) + '%';
  }

  function update() {
    const quota = num('quota'), closed = num('closed');
    const base = num('base') / 100, accel = num('accel') / 100;

    const atBase = Math.min(closed, quota);
    const above = Math.max(0, closed - quota);
    const commission = commissionFor(closed, quota, base, accel);
    const attainment = quota > 0 ? closed / quota * 100 : 0;
    const left = Math.max(0, quota - closed);

    $('att').textContent = quota > 0 ? attainment.toFixed(1) + '%' : '–';
    setBar('bar', attainment);

    $('comm').textContent = usd(commission);
    $('commDetail').textContent = above > 0
      ? `${usd(atBase * base)} base + ${usd(above * accel)} accelerated`
      : '';

    $('left').textContent = left > 0 ? usd(left) : 'Quota hit 🎉';
    $('left').classList.toggle('good', left === 0 && quota > 0);

    const levels = [50, 75, 100, 125, 150];
    const closest = levels.reduce((best, pct) =>
      Math.abs(pct - attainment) < Math.abs(best - attainment) ? pct : best
    );
    $('scenarios').innerHTML = levels.map(pct => {
      const needed = quota * pct / 100;
      const earned = commissionFor(needed, quota, base, accel);
      const isCurrent = quota > 0 && pct === closest;
      return `<tr${isCurrent ? ' class="current"' : ''}>
        <td>${pct}%${isCurrent ? ' <span class="badge">Closest</span>' : ''}</td>
        <td>${usd(needed)}</td>
        <td>${usd(earned)}</td>
      </tr>`;
    }).join('');

    // Deal what-if: diff of total commission handles deals that straddle quota.
    const deal = num('deal');
    const newTotal = closed + deal;
    const dealComm = commissionFor(newTotal, quota, base, accel) - commission;
    const dealBase = Math.max(0, Math.min(newTotal, quota) - closed);
    const dealAccel = deal - dealBase;
    const newAtt = quota > 0 ? newTotal / quota * 100 : 0;

    $('dealComm').textContent = usd(dealComm);
    $('dealDetail').textContent = dealBase > 0 && dealAccel > 0
      ? `${usd(dealBase * base)} base + ${usd(dealAccel * accel)} accelerated`
      : '';
    $('newAtt').textContent = quota > 0
      ? `${newAtt.toFixed(1)}% (+${(newAtt - attainment).toFixed(1)} pts)`
      : '–';
    setBar('newBar', newAtt);
  }

  document.querySelectorAll('input').forEach(i => i.addEventListener('input', update));
  update();
</script>
</body>
</html>
